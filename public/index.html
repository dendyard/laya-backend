<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laya CMS — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand:        #6366f1;
      --brand-dark:   #4f46e5;
      --brand-light:  #eef2ff;
      --slate-50:     #f8fafc;
      --slate-100:    #f1f5f9;
      --slate-200:    #e2e8f0;
      --slate-400:    #94a3b8;
      --slate-500:    #64748b;
      --slate-700:    #334155;
      --slate-800:    #1e293b;
      --slate-900:    #0f172a;
      --red-50:       #fef2f2;
      --red-500:      #ef4444;
      --red-600:      #dc2626;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--slate-900);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99,102,241,.35), transparent),
        radial-gradient(ellipse 60% 40% at 80% 110%, rgba(79,70,229,.2), transparent);
      padding: 1.5rem;
    }

    /* grid overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .wrap {
      width: 100%;
      max-width: 400px;
      position: relative;
      z-index: 1;
    }

    /* ── Logo ── */
    .logo-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .75rem;
      margin-bottom: 2rem;
    }
    .logo-icon {
      width: 48px; height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 0 1px rgba(99,102,241,.3), 0 8px 24px rgba(99,102,241,.4);
    }
    .logo-icon svg { width: 22px; height: 22px; }
    .logo-title {
      font-size: 1.25rem; font-weight: 700;
      color: #fff; letter-spacing: -.02em;
    }
    .logo-sub {
      font-size: .75rem; font-weight: 500;
      color: var(--slate-400); letter-spacing: .06em; text-transform: uppercase;
    }

    /* ── Card ── */
    .card {
      background: rgba(255,255,255,.97);
      border-radius: 20px;
      padding: 2rem;
      box-shadow:
        0 0 0 1px rgba(0,0,0,.06),
        0 4px 6px -1px rgba(0,0,0,.07),
        0 20px 60px -10px rgba(0,0,0,.35);
    }

    .card-title {
      font-size: 1rem; font-weight: 600; color: var(--slate-800);
      margin-bottom: 1.5rem;
    }

    /* ── Form ── */
    .field { margin-bottom: 1rem; }
    .field label {
      display: block; font-size: .8125rem; font-weight: 500;
      color: var(--slate-700); margin-bottom: .375rem;
    }
    .field-wrap { position: relative; }
    .field-wrap input {
      width: 100%; padding: .625rem .875rem;
      border: 1px solid var(--slate-200);
      border-radius: 10px;
      font-size: .875rem; font-family: inherit;
      color: var(--slate-800);
      background: var(--slate-50);
      outline: none;
      transition: border-color .15s, box-shadow .15s, background .15s;
    }
    .field-wrap input:focus {
      border-color: var(--brand);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(99,102,241,.12);
    }
    .field-wrap input.has-icon { padding-right: 2.5rem; }
    .eye-btn {
      position: absolute; right: .75rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--slate-400); display: flex; padding: .125rem;
      transition: color .15s;
    }
    .eye-btn:hover { color: var(--slate-600); }

    /* ── Error ── */
    .error-box {
      display: none;
      padding: .625rem .875rem;
      background: var(--red-50);
      border: 1px solid #fecaca;
      border-radius: 10px;
      font-size: .8125rem; color: var(--red-600);
      margin-bottom: 1rem;
      align-items: center; gap: .5rem;
    }
    .error-box.show { display: flex; }

    /* ── Button ── */
    .btn-submit {
      width: 100%; padding: .6875rem;
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      color: #fff; border: none; border-radius: 10px;
      font-size: .875rem; font-weight: 600; font-family: inherit;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: .5rem;
      transition: opacity .15s, transform .1s, box-shadow .15s;
      box-shadow: 0 4px 14px rgba(99,102,241,.4);
      margin-top: 1.25rem;
    }
    .btn-submit:hover:not(:disabled) {
      opacity: .92;
      box-shadow: 0 6px 20px rgba(99,102,241,.5);
    }
    .btn-submit:active:not(:disabled) { transform: scale(.99); }
    .btn-submit:disabled { opacity: .65; cursor: not-allowed; }

    .spinner {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      animation: spin .7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    .login-footer {
      text-align: center; margin-top: 1.5rem;
      font-size: .75rem; color: var(--slate-400);
    }
    .login-footer span { color: rgba(99,102,241,.7); font-weight: 500; }

    /* ── Shake animation ── */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }
    .shake { animation: shake .35s ease; }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="logo-row">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div>
        <div class="logo-title">Laya CMS</div>
        <div class="logo-sub">Content Management</div>
      </div>
    </div>

    <div class="card" id="card">
      <p class="card-title">Masuk ke akun Anda</p>

      <div class="error-box" id="errBox">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="errMsg"></span>
      </div>

      <form id="form">
        <div class="field">
          <label for="email">Email</label>
          <div class="field-wrap">
            <input id="email" type="email" value="admin@laya.id" required autocomplete="email" placeholder="you@example.com" />
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="field-wrap">
            <input id="password" type="password" value="admin123" required autocomplete="current-password" placeholder="••••••••" class="has-icon" />
            <button type="button" class="eye-btn" id="eyeBtn" aria-label="Tampilkan password">
              <svg id="eyeShow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eyeHide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span class="spinner" id="spinner"></span>
          <span id="btnLabel">Masuk</span>
        </button>
      </form>
    </div>

    <p class="login-footer">Laya Backend <span>v2.0</span> · Bun + Elysia</p>
  </div>

  <script>
    const API = '/api'

    // Redirect if already authenticated
    ;(async () => {
      const t = localStorage.getItem('laya_token')
      if (!t) return
      try {
        const r = await fetch(`${API}/auth/session`, { headers: { Authorization: `Bearer ${t}` } })
        const j = await r.json()
        if (j.data?.authenticated) location.href = '/admin/dashboard.html'
      } catch {}
    })()

    // Eye toggle
    const pwEl = document.getElementById('password')
    document.getElementById('eyeBtn').addEventListener('click', () => {
      const isText = pwEl.type === 'text'
      pwEl.type = isText ? 'password' : 'text'
      document.getElementById('eyeShow').style.display = isText ? '' : 'none'
      document.getElementById('eyeHide').style.display = isText ? 'none' : ''
    })

    // Form submit
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const btn = document.getElementById('submitBtn')
      const spinner = document.getElementById('spinner')
      const label = document.getElementById('btnLabel')
      const errBox = document.getElementById('errBox')

      btn.disabled = true
      spinner.style.display = 'block'
      label.textContent = 'Memproses…'
      errBox.classList.remove('show')

      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: pwEl.value,
          }),
        })
        const data = await res.json()
        if (data.success) {
          localStorage.setItem('laya_token', data.data.token)
          localStorage.setItem('laya_user', JSON.stringify(data.data.user))
          label.textContent = 'Masuk…'
          location.href = '/admin/dashboard.html'
        } else {
          showErr(data.message ?? 'Login gagal. Periksa email dan password.')
        }
      } catch {
        showErr('Tidak dapat terhubung ke server. Pastikan server aktif.')
      } finally {
        btn.disabled = false
        spinner.style.display = 'none'
        label.textContent = 'Masuk'
      }
    })

    function showErr(msg) {
      const box = document.getElementById('errBox')
      document.getElementById('errMsg').textContent = msg
      box.classList.add('show')
      document.getElementById('card').style.animation = 'none'
      requestAnimationFrame(() => {
        document.getElementById('card').style.animation = 'shake .35s ease'
      })
    }
  </script>
</body>
</html>
